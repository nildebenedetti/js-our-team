<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Team</title>
    <!-- bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- stylesheet -->
    <link rel="stylesheet" href="styles/style.css">
    <!-- Font by GoogleFont -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Vend+Sans:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="page-header mw-900 text-center">
        <div class="header-text">
            <h1 class="title-hero display-3 p-4 fw-bold text-primary">The Team</h1>
            <p class="team-intro py-3 px-5">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam, veniam dolore dignissimos, ea
                ducimus odit ratione quam animi, quae dolor illo iure voluptatibus maiores maxime mollitia? Nam laborum
                minima voluptas.
            </p>
        </div>
    </header>
    <main class="page-main container">
        <div class="cards-container row mx-auto row-cols-sm-1row-cols-md-3 justify-content-center">
            <!-- sparisceeee la card team member-->
        </div>
        <div class="button-container d-flex justify-content-center mb-5">
            <button class="btn-add">Aggiungi</button>
        </div>


        <!-- con dentro form -->
        <section class="form-container d-none">
            <form class="new-member">
                <div class="mb-3">
                    <label for="member-name" class="form-label">Nome e Cognome</label>
                    <input type="text" class="member-name" id="member-name">
                </div>
                <div class="mb-3">
                    <label for="member-role" class="form-label">Ruolo</label>
                    <input type="text" class="member-role" id="member-role">
                </div>
                <div class="mb-3">
                    <label for="member-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="member-email" aria-describedby="member-email">
                </div>
                <div class="mb-3">
                    <label for="member-portrait" class="form-label">Foto</label>
                    <input type="text" class="image" placeholder="url dell'immagine" id="member-portrait"
                        aria-describedby="member-portrait">
                </div>
                <button type="submit" class="btn btn-submit">Invia</button>
            </form>
        </section>



    </main>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/teams.js"></script>
    <script src="scripts/script.js"></script>

</body>

</html>
